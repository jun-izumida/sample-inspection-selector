services:
  sample_inspection_app:
    image: ${APP_IMAGE}
    container_name: sample_inspection_app_service_${CONTAINER_NAME_SUFFIX}
    #ports:
    #  - ${APP_EXTERNAL_PORT}:8000
    environment:
      http_proxy: ''
      https_proxy: ''
      TZ: Asia/Tokyo
      SCRIPT_NAME: ${SCRIPT_NAME}
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      LANGUAGE_CODE: ${LANGUAGE_CODE}
      TIME_ZONE: ${TIME_ZONE}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      USE_TZ: ${USE_TZ}
      STATIC_ROOT: ${STATIC_ROOT}
      STATIC_URL: ${STATIC_URL}
      APPLICATION_PREFIX: ${APPLICATION_PREFIX}
      DATABASE_URL: ${DATABASE_URL}
      MONGODB: ${MONGODB}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_COLLECTION: ${MONGODB_COLLECTION}
      LOG_BASE_DIR: ${LOG_BASE_DIR}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      EXTERNAL_API_ENDPOINT: ${EXTERNAL_API_ENDPOINT}
      EXTERNAL_API_URL_EPR: ${EXTERNAL_API_URL_EPR}
      EXTERNAL_API_URL_TRACE: ${EXTERNAL_API_URL_TRACE}
      FILE_SEARCH_CONFIG: ${FILE_SEARCH_CONFIG}
    volumes:
      - ${DATA_VOLUME}:/data
      - ${APP_VOLUME}:/app
      - staticfiles:${STATIC_ROOT}
    working_dir: /app
    entrypoint: "./entrypoint.sh"
    expose: 
      - "8000"
    command: ["gunicorn", "apps.wsgi", "--env", "SCRIPT_NAME=${SCRIPT_NAME}", "-b", "0.0.0.0:8000"]
    labels:
      - "traefik.http.routers.${TRAEFIK_ROUTER}-backend-${CONTAINER_NAME_SUFFIX}.rule=PathPrefix(`${TRAEFIK_PATHPREFIX_APP}`)"
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}-backend-${CONTAINER_NAME_SUFFIX}.entrypoints=${TRAEFIK_ENTRYPOINT}"
      #- "traefik.docker.network=${NETWORK}"
    networks:
      - Prd
    restart: unless-stopped
  sample_inspection_app:
    image: ${NGINX_IMAGE}
    container_name: sample_inspection_web_service_${CONTAINER_NAME_SUFFIX}
    environment:
      http_proxy: ''
      https_proxy: ''
    ports:
      - ${HTTP_EXTERNAL_PORT}:80
      - ${HTTPS_EXTERNAL_PORT}:443
    volumes:
      - ../frontend/dist:/etc/nginx/html
      - ./nginx/conf.d:/etc/nginx/conf.d/
      - staticfiles:/staticfiles
    labels:
      - "traefik.http.routers.${TRAEFIK_ROUTER}-frontend-${CONTAINER_NAME_SUFFIX}.rule=PathPrefix(`${TRAEFIK_PATHPREFIX_WEB}`)"
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}-frontend-${CONTAINER_NAME_SUFFIX}.entrypoints=${TRAEFIK_ENTRYPOINT}"
      #- "traefik.docker.network=${NETWORK}"
    depends_on:
      - sample_inspection_app
    networks:
      - Prd
    restart: unless-stopped
networks:
  Prd:
    external: true
volumes:
  staticfiles: